name: Build AgroDensity APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Installer Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Compiler l'APK
        run: |
          java -version
          yes | buildozer -v android debug > build.log 2>&1 || echo failed > failed.txt
          echo "===== ERREURS ====="
          grep -n -i -E "error|failed|exception|not found|no such|what went wrong" build.log | grep -v -E "won't be automatically|DEPRECATION|stty" | tail -n 30
          echo "===== FIN DU JOURNAL ====="
          grep -v -E "^# +[A-Za-z0-9_]+ = " build.log | tail -n 40
          test ! -f failed.txt

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroDensity-APK
          path: bin/*.apk
